id = "herdr-farm"
name = "Farm"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "A coordinator conversation, parallel worker threads, shared memory and an overview of what needs you."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["target/release/herdr-farm", "ticker", "start"]

[[actions]]
id = "new"
title = "Farm: new project"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "new"]

[[actions]]
id = "open"
title = "Farm: open project"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "open"]

[[actions]]
id = "overview"
title = "Farm: overview"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "overview"]

[[actions]]
id = "focus"
title = "Farm: focus sidebar on this project"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "focus"]

[[actions]]
id = "unfocus"
title = "Farm: clear sidebar focus"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "unfocus"]

[[actions]]
id = "adopt-workspace"
title = "Farm: continue this workspace as a project"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Farm: pause project"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "pause"]

[[actions]]
id = "resume"
title = "Farm: resume project"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "resume"]

[[actions]]
id = "fleet"
title = "Farm: fleet"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "fleet"]

[[actions]]
id = "fleet-watch"
title = "Farm: fleet pane (refreshing)"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "fleet-watch"]

[[actions]]
id = "fleet-race"
title = "Farm: propose a candidate group (race)"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "fleet-race"]

[[actions]]
id = "fleet-select"
title = "Farm: select candidate"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "fleet-select"]

[[actions]]
id = "fleet-replay"
title = "Farm: launch a replay-suite run"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "fleet-replay"]

[[actions]]
id = "doctor"
title = "Farm: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-farm", "action", "doctor"]

[[panes]]
id = "overview"
title = "Project overview"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "overview"]

[[panes]]
id = "new"
title = "New project"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "new"]

[[panes]]
id = "pick"
title = "Pick a project"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "pick"]

[[panes]]
id = "adopt"
title = "Continue as a project"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "adopt"]

[[panes]]
id = "fleet"
title = "Farm: fleet"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "fleet"]

[[panes]]
id = "fleet-watch"
title = "Farm: fleet"
placement = "split"
command = ["target/release/herdr-farm", "pane", "fleet-watch"]

[[panes]]
id = "fleet-race"
title = "Propose a candidate group"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "fleet-race"]

[[panes]]
id = "fleet-select"
title = "Select a candidate"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "fleet-select"]

[[panes]]
id = "fleet-replay"
title = "Launch a replay-suite run"
placement = "popup"
command = ["target/release/herdr-farm", "pane", "fleet-replay"]
