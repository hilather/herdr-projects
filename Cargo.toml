[package]
name = "herdr-farm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Coding agent farm for Herdr: a coordinator conversation, parallel worker threads, shared memory and an overview"

[[bin]]
name = "herdr-farm"
path = "src/main.rs"

[features]
default = []
state-store = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "=0.37.0", optional = true, features = ["backup", "hooks", "limits"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
